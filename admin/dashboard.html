<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://www.gstatic.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self';" />
    <title>Admin Dashboard | CS-DPCRU</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles.css?v=20261017-admin" />
  </head>
  <body class="admin-body">
    <div class="admin-shell admin-dashboard-shell">
      <aside class="admin-sidebar">
        <div class="brand admin-brand">
          <span class="brand-mark"><img src="../assets/cs-dpcru-mark.svg" alt="" aria-hidden="true" /></span>
          <span class="brand-text"><strong>CNLU × GIGA</strong><small>CS-DPCRU</small></span>
        </div>
        <nav class="admin-nav">
          <a href="dashboard.html" class="is-active">Dashboard</a>
          <a href="publications.html">Publications</a>
        </nav>
        <button type="button" id="admin-logout" class="btn-secondary btn-block">Logout</button>
      </aside>

      <main class="admin-content">
        <header class="admin-topbar">
          <div>
            <p class="eyebrow">Administration</p>
            <h1>Research Dashboard</h1>
          </div>
          <div class="admin-user-pill"><span>Signed in as</span><strong id="admin-username-display">Admin</strong></div>
        </header>

        <section class="admin-stats-grid">
          <article class="stat-card"><span>Total Publications</span><strong id="stat-total">0</strong></article>
          <article class="stat-card"><span>Published Publications</span><strong id="stat-published">0</strong></article>
          <article class="stat-card"><span>Draft Publications</span><strong id="stat-draft">0</strong></article>
          <article class="stat-card"><span>Archived Publications</span><strong id="stat-archived">0</strong></article>
          <article class="stat-card"><span>Total Categories</span><strong id="stat-categories">0</strong></article>
        </section>

        <section class="admin-panel">
          <div class="admin-panel-header">
            <h2>Recently Added Publications</h2>
            <a href="publications.html" class="btn-link">Manage publications</a>
          </div>
          <div id="recent-publications" class="list-stack"></div>
        </section>

        <section class="admin-panel">
          <div class="admin-panel-header">
            <h2>Recent Activity</h2>
          </div>
          <div id="recent-activity" class="list-stack"></div>
        </section>
      </main>
    </div>
    <script src="../script.js"></script>
  </body>
</html>
